<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer Budżetu</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
     <script src="script.js"></script>
</head>
<body>
    <!-- formularz -->
    <form>
        <div class="mb-3">
            <label for="opis" class="form-label">Opis</label>
            <input type="text" id="opis" class="form-control" name="opis" placeholder="wpisz opis">
        </div>
        <div class="mb-3">
            <label for="kwota" class="form-label">Kwota</label>
            <input type="number" id="kwota" step="0.01" class="form-control" id="kwota" placeholder="wpisz kwote">
            
        </div>

        <div class="mb-3">
            <label for="typ" class="form-label">Wybierz typ</label>
            <select class="form-select" name="typ" id="typ">
                <option value="wydatek">Wydatek</option>
                <option value="przychod">Przychód</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="kategoria" class="form-label">Wybierz kategorie</label>
            <select class="form-select" name="kategoria" id="kategoria">
                <option value="1">kat1</option>
                <option value="2">kat2</option>
                <option value="3">kat3</option>
                <option value="4">kat4</option>
                <option value="5">kat5</option>
                
            </select>

        </div>

        <button type="submit" class="btn btn-primary">Dodaj</button>
    </form>

    <!-- tabela -->

    <div class="border rounded-3 overflow-auto">
        <table class="table table-striped mb-0">
            <thead>
                <tr>
                <th scope="col">opis</th>
                <th scope="col">kategoria</th>
                <th scope="col">kwota</th>
                <th scope="col">operacja</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

    <!-- podsumowanie -->
    <div>
        <h2>Podsumowanie</h2>

        <p>suma przychodów: </p>
        <p>suma wydatków: </p>
        <p>saldo: </p>

    </div>

    
    



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>
